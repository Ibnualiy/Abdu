name: merchandising_app
description: "Merchandising Analysis and Controlling App — offline-first inventory, sales, and profit/loss tracker for merchants."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # Local offline-first database
  sqflite: ^2.3.3
  path: ^1.9.0

  # Online sync / backend (Supabase)
  supabase_flutter: ^2.5.6

  # Connectivity detection (online vs offline)
  connectivity_plus: ^6.0.3

  # State management
  provider: ^6.1.2

  # Charts (weekly sales trend, category breakdown)
  fl_chart: ^0.68.0

  # Local caching (e.g. last-known subscription status)
  shared_preferences: ^2.2.3

  # Formatting (ETB currency, dates)
  intl: ^0.19.0

  # Client-generated IDs so records work fully offline
  uuid: ^4.4.0

  # Hashing the local app-lock PIN before storing it
  crypto: ^3.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
